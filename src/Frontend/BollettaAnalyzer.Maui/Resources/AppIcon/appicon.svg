<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <!-- Layer di sfondo dell'adaptive icon Android: tinta piena del brand.
       Volutamente senza gradienti: il Resizetizer di MAUI ha un supporto
       parziale sugli SVG e le tinte piene sono la scelta sicura (il colore
       è comunque ribadito dall'attributo Color di MauiIcon nel csproj). -->
  <rect width="456" height="456" fill="#6366F1"/>
</svg>
